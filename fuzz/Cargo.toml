[package]
name = "officewright-fuzz"
version = "0.0.0"
edition = "2024"
license = "BUSL-1.1"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
officewright-core = { path = "../crates/officewright-core" }
officewright-doc = { path = "../crates/officewright-doc" }
officewright-font = { path = "../crates/officewright-font" }
officewright-layout = { path = "../crates/officewright-layout", features = [
  "fuzzing",
] }
officewright-opc = { path = "../crates/officewright-opc" }
officewright-pdf = { path = "../crates/officewright-pdf" }
# A second XML parser as an oracle: the xml target checks that both accept and reject the
# same documents and read the same content from them.
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }

# A workspace of its own, as cargo-fuzz lays it out: the targets build with nightly-only
# flags, and libfuzzer-sys bundles LLVM's libFuzzer (NCSA license), which officewright
# never ships, so the workspace-wide checks and `cargo deny` leave it out.
[workspace]

[[bin]]
name = "docx_open"
path = "fuzz_targets/docx_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_parse"
path = "fuzz_targets/font_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_subset"
path = "fuzz_targets/font_subset.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jpeg_header"
path = "fuzz_targets/jpeg_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout_shape"
path = "fuzz_targets/layout_shape.rs"
test = false
doc = false
bench = false

[[bin]]
name = "package"
path = "fuzz_targets/package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_embed"
path = "fuzz_targets/pdf_embed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "png_decode"
path = "fuzz_targets/png_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shape_font"
path = "fuzz_targets/shape_font.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml"
path = "fuzz_targets/xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_archive"
path = "fuzz_targets/zip_archive.rs"
test = false
doc = false
bench = false
