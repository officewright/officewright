[package]
name = "corpus-runner"
description = "Runs officewright over corpora of documents, one child process per file, and compares the results with a baseline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Inflates the reference pages, PNG files; already the DEFLATE of officewright-opc.
miniz_oxide = { version = "0.9.1", default-features = false, features = [
  "with-alloc",
] }
# Opens the documents, and renders them into PDF with --render.
officewright-doc = { workspace = true, features = ["pdf"] }
# Approved for this tool only (issue #36): the report and the baseline are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Writes the PDFs the tests read back through pdftotext and pdftoppm.
officewright-pdf.workspace = true

[lints]
workspace = true
