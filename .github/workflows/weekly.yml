name: Weekly

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: fetch every external corpus
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Downloads every source from scratch and verifies every pin and SHA-256.
      - run: scripts/fetch-corpus.sh all
