name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the required checks on each queued pull request merged into main.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # A cache saved from a merge queue's branch serves no later run (each queue branch
        # has its own ref) and only pushes main's caches out of the repository's quota.
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,typos@1.50.3,taplo@0.10.0,shellcheck@0.11.0
          fallback: none
      # Not packaged by install-action: release archives, pinned by SHA-256. cargo-c's
      # pins are shared with release.yml in scripts/install-cargo-c.sh.
      - name: Install actionlint and cargo-c
        shell: bash
        run: |
          tools=$RUNNER_TEMP/tools
          scripts/install-cargo-c.sh "$tools"
          base=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          case $RUNNER_OS in
            Linux)
              file=actionlint_1.7.12_linux_amd64.tar.gz
              sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              ;;
            macOS)
              file=actionlint_1.7.12_darwin_arm64.tar.gz
              sha256=aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f
              ;;
            Windows)
              file=actionlint_1.7.12_windows_amd64.zip
              sha256=6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9
              ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$file" "$base/$file"
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          echo "$sha256  $file" | $sum -c -
          case $file in
            *.zip) unzip -oq "$file" -d "$tools" ;;
            *) tar -xzf "$file" -C "$tools" ;;
          esac
          echo "$tools" >> "$GITHUB_PATH"
      # check.sh validates generated PDFs with them on Linux and macOS.
      - name: Install qpdf and poppler
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends qpdf poppler-utils
          else
            brew install qpdf poppler
          fi
          # Not pinned (see CLAUDE.md), so the log records which versions ran. No pipe:
          # under pipefail, `| head` can kill the command with SIGPIPE and fail the step.
          qpdf --version
          pdftotext -v
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - run: bash scripts/check.sh
        shell: bash

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # The corpus runner's tests read PDFs back through pdftotext and pdftoppm, and score
      # them with qpdf and pdffonts.
      - name: Install poppler and qpdf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils qpdf
          pdftotext -v
          qpdf --version
      - run: cargo test --workspace --all-features
