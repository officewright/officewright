language = "C"
include_guard = "OFFICEWRIGHT_H"
cpp_compat = true
autogen_warning = "/* Generated by cargo-c (cbindgen) from crates/officewright-ffi. Do not edit. */"
# `size_t` rather than `uintptr_t` for Rust's usize.
usize_is_size_t = true

[enum]
# OwStatus::NullArgument becomes OW_STATUS_NULL_ARGUMENT.
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
