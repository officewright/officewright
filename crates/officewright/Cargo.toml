[package]
name = "officewright"
description = "Read, write and convert office documents without Microsoft Office or LibreOffice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["doc", "pdf", "slides", "xls"]
doc = ["dep:officewright-doc"]
pdf = ["dep:officewright-font", "dep:officewright-pdf"]
slides = ["dep:officewright-slides"]
xls = ["dep:officewright-xls"]

[dependencies]
officewright-doc = { workspace = true, optional = true }
officewright-font = { workspace = true, optional = true }
officewright-pdf = { workspace = true, optional = true }
officewright-slides = { workspace = true, optional = true }
officewright-xls = { workspace = true, optional = true }
