[package]
name = "officewright-pdf"
description = "PDF reading and writing for officewright"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
# Adobe's AFM files and the test fonts are not under Officewright's license, so the AFM
# files and the tests that read them stay in the repository; see THIRD-PARTY-NOTICES.md.
exclude = [
  "data/afm",
  "tests/helvetica_afm.rs",
  "tests/embedded_fonts.rs",
  "tests/glyph_runs.rs",
]

[features]
# Shows the drawing primitives the layout engine paints with (glyph runs, paths, strokes,
# clipping, images) in the documentation. They are public and compiled either way, and exempt
# from semver until 1.0; the facade does not pass the feature on.
unstable-drawing = []

[dependencies]
# Flate (zlib) compression of content and font streams. officewright-opc reads ZIP
# archives with it, so the workspace builds it already.
miniz_oxide = { version = "0.9.1", default-features = false, features = [
  "with-alloc",
] }
officewright-core.workspace = true
officewright-font.workspace = true
# The Unicode Script property, to refuse text that needs shaping or right-to-left
# layout; no dependencies of its own.
unicode-script = { version = "0.5.8", default-features = false }

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }

[lints]
workspace = true
