[package]
name = "officewright-layout"
description = "Page layout engine for officewright"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
# The test fonts under tests/fonts/ at the repository root keep their own licenses (see
# THIRD-PARTY-NOTICES.md) and are not part of this crate, so the tests that read them
# stay in the repository too.
exclude = [
  "tests/shaping.rs",
  "tests/fonts.rs",
  "tests/lines.rs",
  "tests/pages.rs",
  "tests/render.rs",
  "tests/common",
  "tests/display.rs",
  "tests/snapshots",
  "tests/symbol_table.rs",
  "data",
]

[features]
# Shows the layout IR (the `ir` module) in the documentation. The module is public and
# compiled either way; it is exempt from semver until 1.0.
unstable-ir = []
# Entry points for the fuzz targets, the examples and the tests that use the repository's
# test fonts. Not part of the API.
fuzzing = []
# Rendering into PDF (`render_pdf`), painting with officewright-pdf.
pdf = ["dep:officewright-pdf"]

[dependencies]
# Pinned exactly: HarfRust is 0.x, and the layout follows its API behind one private
# module.
harfrust = { version = "=0.14.0", default-features = false, features = ["std"] }
officewright-core.workspace = true
officewright-font.workspace = true
# Our own PDF writer, for rendering; it depends on neither this crate nor officewright-doc.
officewright-pdf = { workspace = true, optional = true }
# The Unicode line breaking algorithm (UAX #14), where lines may end (approved with
# HarfRust); no dependencies of its own.
unicode-linebreak = { version = "0.1.5", default-features = false }
# The Unicode Script property, to cut text into runs of one script (approved with
# HarfRust); no dependencies of its own, and officewright-pdf has it already.
unicode-script = { version = "0.5.8", default-features = false }

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }

[lints]
workspace = true

[[example]]
name = "shape_dump"
required-features = ["fuzzing"]

[[example]]
name = "paragraph_dump"
required-features = ["fuzzing"]

[[example]]
name = "layout_dump"
required-features = ["fuzzing"]
