[default]
extend-ignore-re = [
  # MSVC's object-file option, used in scripts/check.sh.
  '-Fo"',
  # Unicode code points in Rust escapes and in text: hexadecimal, not words.
  '\\u\{[0-9A-Fa-f]{1,6}\}',
  'U\+[0-9A-Fa-f]{4,6}',
]

[files]
# Test documents are third-party content; only our own text is spell-checked.
extend-exclude = [
  "tests/corpus/*",
  "!tests/corpus/SOURCES.md",
  # Unicode's Adobe Symbol mapping, kept as published.
  "crates/officewright-layout/data/*",
]

[default.extend-words]
# PDF's Flate filter (FlateDecode, ISO 32000-1, 7.4.4), not a misspelling of "flat".
flate = "flate"
# PDF's /DecodeParms key (ISO 32000-1, 7.3.8.2), not a misspelling of "params".
parms = "parms"
# PNG's Paeth filter (PNG specification, 9.4), named after Alan W. Paeth, not "path".
paeth = "paeth"
# Unicode's spelling of the Greek letter in character names (GREEK SMALL LETTER LAMDA).
lamda = "lamda"
# OpenType tags, not misspellings: the glyph location table and the width axis.
loca = "loca"
wdth = "wdth"
# The ISO 15924 code of the Bengali script, by which themes name a script's font.
beng = "beng"
